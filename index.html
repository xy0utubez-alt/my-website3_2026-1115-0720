<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マイページ">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<title>マイページ</title>
<style>
:root{
  --bg:#eceff3; --card:#fbfcfd; --ink:#16213a; --sub:#5a6578; --line:#d3d9e2;
  --accent:#2f5bd8; --accent-ink:#fff; --danger:#c8372d; --sat:#2f5bd8; --sun:#c8372d; --hover:#e4e9f1;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1420; --card:#171e2e; --ink:#e6ebf5; --sub:#98a3b8; --line:#2b3550;
        --accent:#7aa2ff; --accent-ink:#0f1420; --danger:#ff7a70; --sat:#7aa2ff; --sun:#ff7a70; --hover:#1f2840}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-text-size-adjust:100%;overscroll-behavior:none}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{min-height:44px;min-width:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:default}
.muted{color:var(--sub);font-size:14px}

/* ログイン */
.auth{min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.auth form{width:100%;max-width:380px;display:grid;gap:12px}
.auth h1{margin:0 0 4px;font-size:26px;letter-spacing:.02em}
.msg{min-height:1.5em;font-size:14px;color:var(--danger);margin:0}
.msg.ok{color:var(--sub)}
.conn{margin:0;font-size:13px;line-height:1.5;display:flex;gap:8px;align-items:flex-start;color:var(--sub);cursor:pointer}
.conn::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:var(--sub)}
.conn.ok::before{background:#2e9e5b}
.conn.bad{color:var(--danger)}
.conn.bad::before{background:var(--danger)}

/* 全体 */
#app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "main" "nav";
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{grid-area:head;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{margin:0;font-size:18px;flex:1}
.status{font-size:13px;color:var(--sub)}
.status.err{color:var(--danger)}
nav{grid-area:nav;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:52px;border:0;background:none;cursor:pointer;color:var(--sub);font-size:14px}
nav button[aria-current="true"]{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
main{grid-area:main;min-height:0;position:relative}
main>section{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#v-notes,#v-files{overflow:hidden}
@media (min-width:768px){
  #app{grid-template-columns:180px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"head head" "nav main"}
  header{padding-top:12px}
  nav{flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:8px 0}
  nav button{flex:none;text-align:left;padding:0 20px;min-height:48px}
  nav button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--accent)}
}

/* 一覧+詳細(メモ・ファイル共通) */
.split{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
.pl,.pd{min-height:0;display:flex;flex-direction:column}
.pd{display:none;padding:12px 16px;gap:10px;background:var(--card);overflow:auto;-webkit-overflow-scrolling:touch}
.split.open .pl{display:none}
.split.open .pd{display:flex}
.bar{display:flex;gap:8px;padding:12px 16px}
.items{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px;display:grid;gap:6px;align-content:start}
.item{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;cursor:pointer;display:block;width:100%;min-height:44px}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span{display:block;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pd .title{font-weight:700;font-size:18px}
.pd textarea{flex:1;min-height:50vh;resize:none;line-height:1.7}
.back{display:inline-flex;align-items:center;justify-content:center}
.empty{margin:auto;color:var(--sub);text-align:center;padding:24px}
@media (min-width:768px){
  .split{grid-template-columns:320px minmax(0,1fr)}
  .pl{border-right:1px solid var(--line)}
  .pd{display:flex!important}
  .split.open .pl{display:flex}
  .back{display:none}
  .pd textarea{min-height:0}
}

/* ファイル */
.pv{display:grid;gap:10px}
.pv img,.pv video{max-width:100%;max-height:70vh;border-radius:8px;background:var(--bg)}
.pv audio{width:100%}
.pv iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.pv pre{margin:0;white-space:pre-wrap;word-break:break-word;max-height:60vh;overflow:auto;background:var(--bg);padding:12px;border-radius:8px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.drop{outline:2px dashed var(--accent);outline-offset:-8px}

/* カレンダー */
.cal{display:grid;gap:16px;padding:16px;grid-template-columns:minmax(0,1fr);align-content:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-head h2{margin:0;font-size:20px;flex:1;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.dow{text-align:center;font-size:13px;color:var(--sub);padding:4px 0}
.dow:first-child,.day.sun{color:var(--sun)}
.dow:nth-child(7),.day.sat{color:var(--sat)}
.day{aspect-ratio:1/1;min-height:44px;border:1px solid transparent;border-radius:8px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.day.blank{background:none;cursor:default}
.day.today{border-color:var(--accent);font-weight:700}
.day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start}
.panel h3{margin:0;font-size:17px}
.ev{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.ev .t{color:var(--sub);font-size:14px;min-width:3.2em}
.ev .n{flex:1;word-break:break-word}
.add{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px}
.add .btn{grid-column:1/-1}
@media (min-width:768px){.cal{grid-template-columns:minmax(0,1fr) 340px;max-width:1100px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="auth" class="auth" hidden>
  <form id="authForm">
    <h1>マイページ</h1>
    <p id="conn" class="conn" role="status" title="タップで再確認"></p>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ユーザー名" required>
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
    <p id="authMsg" class="msg" role="alert"></p>
    <button id="authBtn" class="btn primary" type="submit">ログイン</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <h1 id="pageTitle">メモ</h1>
    <span id="status" class="status" role="status"></span>
    <button id="logoutBtn" class="btn" type="button">ログアウト</button>
  </header>
  <nav id="nav" aria-label="メニュー">
    <button data-v="notes" aria-current="true">メモ</button>
    <button data-v="cal">カレンダー</button>
    <button data-v="files">ファイル</button>
  </nav>
  <main>
    <section id="v-notes"></section>
    <section id="v-cal" hidden></section>
    <section id="v-files" hidden></section>
  </main>
</div>

<script>
"use strict";
/* ============ 設定(ここだけ書き換える) ============ */
const SUPABASE_URL = "https://vbufowedksgbsafjoriq.supabase.co";
const SUPABASE_KEY = "sb_publishable_U7pk6AmmOBXxKBFZq2ejCA_omxK8KX3";
// ユーザー名はこのドメインを付けたメールアドレスとして Supabase に登録します
// const EMAIL_DOMAIN = "mypage.example.com";
/* ================================================= */

const $ = s => document.querySelector(s);
const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.startsWith("YOUR-");
const libOk = typeof supabase !== "undefined";
const sb = configured && libOk ? supabase.createClient(SUPABASE_URL.trim(), SUPABASE_KEY.trim()) : null;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16) }));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt = t => new Date(t).toLocaleString("ja-JP", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
const fmtSize = n => n < 1048576 ? Math.max(1, Math.round(n/1024)) + "KB" : (n/1048576).toFixed(1) + "MB";

function h(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==="class") e.className = v;
    else if(k==="value") e.value = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(v===true) e.setAttribute(k,"");
    else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const c of kids.flat()) if(c!=null) e.append(c);
  return e;
}
function setStatus(t, err){ const s=$("#status"); s.textContent=t; s.className="status"+(err?" err":"") }

/* ============ 状態 ============ */
let user = null, view = "notes";
let state = { notes:[], events:[], files:[] };
let curNote = null, q = "", selFile = null;
let cal = (()=>{ const d=new Date(); d.setDate(1); return d })();
let sel = ymd(new Date());
const dirty = new Set(), saveT = {};
let loading = false, again = false, poll = null, chan = null, reloadT = null;

/* ============ 認証 ============ */
function showAuth(){
  $("#app").hidden = true; $("#auth").hidden = false;
  $("#u").value = ""; $("#p").value = "";
  checkConn();
}
function msg(t, ok){ const m=$("#authMsg"); m.textContent=t; m.className="msg"+(ok?" ok":"") }

/* 接続状態の表示 */
function setConn(kind, text){ const c=$("#conn"); c.className="conn"+(kind==="ok"?" ok":kind==="bad"?" bad":""); c.textContent=text }
async function checkConn(){
  if(!configured){ setConn("bad","未設定: index.html の SUPABASE_URL と SUPABASE_KEY を書き換えてください。"); return }
  if(!libOk){ setConn("bad","接続NG: Supabase のライブラリを読み込めません。ネット接続や広告ブロックを確認してください。"); return }
  setConn("wait","Supabase に接続を確認中…");
  try{
    const base = SUPABASE_URL.trim().replace(/\/+$/,"");
    const r = await fetch(base + "/auth/v1/settings", { headers:{ apikey:SUPABASE_KEY.trim() } });
    if(r.ok){
      const j = await r.json().catch(() => ({}));
      setConn("ok", "Supabase に接続できています" + (j.disable_signup === false ? "(新規登録が有効です。オフにすることをおすすめします)" : ""));
    }
    else if(r.status===401 || r.status===403) setConn("bad", `接続NG: キー(SUPABASE_KEY)が正しくありません (HTTP ${r.status})`);
    else setConn("bad", `接続NG: HTTP ${r.status}。SUPABASE_URL が「https://xxxx.supabase.co」の形か確認してください。`);
  }catch{
    setConn("bad","接続NG: サーバーに届きません。SUPABASE_URL の綴り、ネット接続、プロジェクトの一時停止を確認してください。");
  }
}
$("#conn").addEventListener("click", checkConn);
function loginErrorText(err, email){
  const m = (err.message || "").toLowerCase();
  if(err.status===0 || err.name==="AuthRetryableFetchError" || /fetch|network/.test(m))
    return "Supabase に接続できません。上の接続表示を確認してください。";
  if(m.includes("email not confirmed"))
    return "アカウントが未確認です。Supabase の Authentication → Users で、ユーザーを Auto Confirm 付きで作り直してください。";
  if(m.includes("invalid login credentials"))
    return `ユーザー名またはパスワードが違います。照合したメールアドレス: ${email}。Supabase の Users に同じメールアドレスのユーザーがあるか確認してください。`;
  return "ログインに失敗しました: " + err.message;
}

$("#authForm").addEventListener("submit", async e => {
  e.preventDefault();
  if(!sb){ msg("Supabase に接続できる状態ではありません。上の表示を確認してください。"); return }
  const btn = $("#authBtn"); btn.disabled = true; msg("確認中…", true);
  const email = $("#u").value.trim().toLowerCase();
  const { data, error } = await sb.auth.signInWithPassword({ email, password: $("#p").value });
  if(error){ await sleep(800); msg(loginErrorText(error, email)); btn.disabled = false; return }
  btn.disabled = false; msg("");
  await enter(data.session.user);
});
$("#logoutBtn").addEventListener("click", async () => { await flushAll(); await sb.auth.signOut() });

async function enter(u){
  user = u;
  $("#auth").hidden = true; $("#app").hidden = false;
  $("#u").value = ""; $("#p").value = "";
  curNote = null; selFile = null; q = "";
  setView("notes");
  await reload();
  startSync();
}
function leave(){
  stopSync(); user = null;
  state = { notes:[], events:[], files:[] }; dirty.clear();
  for(const id of ["v-notes","v-cal","v-files"]) $("#"+id).replaceChildren();
  showAuth();
}
if(sb){
  sb.auth.onAuthStateChange(ev => { if(ev === "SIGNED_OUT") leave() });
  sb.auth.getSession().then(({data}) => data.session ? enter(data.session.user) : showAuth());
} else showAuth();

/* ============ 同期 ============ */
async function reload(){
  if(!sb || !user) return;
  if(loading){ again = true; return }
  loading = true;
  try{
    const [a,b,c] = await Promise.all([
      sb.from("notes").select("*").order("updated_at",{ascending:false}),
      sb.from("events").select("*"),
      sb.from("files").select("*").order("created_at",{ascending:false})
    ]);
    if(a.error || b.error || c.error){ setStatus("同期に失敗しました", true); return }
    const local = new Map(state.notes.map(n => [n.id, n]));
    state.notes = a.data.map(n => dirty.has(n.id) && local.has(n.id) ? local.get(n.id) : n);
    for(const id of dirty){ const l = local.get(id); if(l && !state.notes.some(x => x.id===id)) state.notes.push(l) }
    state.events = b.data; state.files = c.data;
    if(curNote && !state.notes.some(n => n.id===curNote)) curNote = null;
    if(selFile && !state.files.some(f => f.id===selFile)) selFile = null;
    if(!dirty.size) setStatus("同期済み");
    rerender();
  } finally {
    loading = false;
    if(again){ again = false; reload() }
  }
}
function typingIn(sec){
  const a = document.activeElement;
  return !!a && $(sec).contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName);
}
function rerender(){
  if(view==="notes"){ typingIn("#v-notes") ? renderList() : renderNotes() }
  else if(view==="cal"){ if(!typingIn("#v-cal")) renderCal() }
  else if(view==="files"){ renderFiles() }
}
function startSync(){
  stopSync();
  chan = sb.channel("mypage-sync").on("postgres_changes", {event:"*", schema:"public"}, () => {
    clearTimeout(reloadT); reloadT = setTimeout(reload, 300);
  }).subscribe();
  poll = setInterval(reload, 60000);
}
function stopSync(){ if(chan){ sb.removeChannel(chan); chan = null } clearInterval(poll); clearTimeout(reloadT) }
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") flushAll();
  else if(user) reload();
});
addEventListener("online", () => { if(user){ flushAll(); reload() } });

/* ============ ナビ ============ */
const TITLES = { notes:"メモ", cal:"カレンダー", files:"ファイル" };
function setView(v){
  view = v;
  for(const b of document.querySelectorAll("#nav button")) b.setAttribute("aria-current", String(b.dataset.v===v));
  for(const k of Object.keys(TITLES)) $("#v-"+k).hidden = k !== v;
  $("#pageTitle").textContent = TITLES[v];
  if(v==="notes") renderNotes();
  if(v==="cal") renderCal();
  if(v==="files") renderFiles();
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if(b) setView(b.dataset.v) });

/* ============ メモ ============ */
function renderNotes(){
  const root = $("#v-notes"); root.replaceChildren();
  const list = h("div",{class:"pl"},
    h("div",{class:"bar"},
      h("input",{type:"search",placeholder:"メモを検索",value:q,"aria-label":"メモを検索",oninput:e=>{q=e.target.value;renderList()}}),
      h("button",{class:"btn primary",type:"button","aria-label":"新しいメモ",onclick:newNote},"新規")),
    h("div",{class:"items",id:"items"}));
  root.append(h("div",{class:"split"+(curNote?" open":"")}, list, h("div",{class:"pd",id:"editor"})));
  renderList(); renderEditor();
}
function renderList(){
  const box = $("#items"); if(!box) return; box.replaceChildren();
  const k = q.trim().toLowerCase();
  const notes = state.notes.filter(n => !k || (n.title+"\n"+n.body).toLowerCase().includes(k))
                           .sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  if(!notes.length){ box.append(h("div",{class:"empty"}, state.notes.length ? "一致するメモはありません。" : "メモはまだありません。「新規」から作成できます。")); return }
  for(const n of notes){
    const first = n.body.split("\n").find(l => l.trim()) || "";
    box.append(h("button",{class:"item",type:"button","aria-current":String(n.id===curNote),onclick:()=>{curNote=n.id;renderNotes()}},
      h("b",{}, n.title || first || "無題のメモ"), h("span",{}, fmt(n.updated_at)+"  "+first)));
  }
}
function renderEditor(){
  const ed = $("#editor"); if(!ed) return; ed.replaceChildren();
  const n = state.notes.find(x => x.id===curNote);
  if(!n){ ed.append(h("div",{class:"empty"},"メモを選ぶか、新規作成してください。")); return }
  ed.append(
    h("div",{class:"row"},
      h("button",{class:"btn back",type:"button",onclick:()=>{curNote=null;renderNotes()}},"戻る"),
      h("span",{class:"muted",style:"flex:1;text-align:right"},"更新 "+fmt(n.updated_at)),
      h("button",{class:"btn danger",type:"button",onclick:()=>deleteNote(n)},"削除")),
    h("input",{class:"title",placeholder:"タイトル",value:n.title,"aria-label":"タイトル",oninput:e=>{n.title=e.target.value;touch(n)}}),
    h("textarea",{placeholder:"ここにメモを書きます",value:n.body,"aria-label":"本文",oninput:e=>{n.body=e.target.value;touch(n)}}));
}
function touch(n){ n.updated_at = new Date().toISOString(); queueNote(n); renderList() }
function queueNote(n){
  dirty.add(n.id); clearTimeout(saveT[n.id]); setStatus("保存中…");
  saveT[n.id] = setTimeout(() => flushNote(n.id), 600);
}
async function flushNote(id){
  clearTimeout(saveT[id]);
  const n = state.notes.find(x => x.id===id); if(!n){ dirty.delete(id); return }
  const ver = n.updated_at;
  const { error } = await sb.from("notes").upsert({ id:n.id, title:n.title, body:n.body, updated_at:n.updated_at });
  if(error){ setStatus("保存に失敗。再試行します", true); saveT[id] = setTimeout(() => flushNote(id), 5000); return }
  if(n.updated_at === ver) dirty.delete(id);
  if(!dirty.size) setStatus("同期済み");
}
async function flushAll(){ await Promise.all([...dirty].map(flushNote)) }
function newNote(){
  const n = { id:uid(), title:"", body:"", updated_at:new Date().toISOString() };
  state.notes.push(n); curNote = n.id; q = ""; queueNote(n); renderNotes();
  const t = document.querySelector("#editor .title"); if(t) t.focus();
}
async function deleteNote(n){
  if(!confirm("このメモを削除しますか?")) return;
  clearTimeout(saveT[n.id]); dirty.delete(n.id);
  state.notes = state.notes.filter(x => x.id!==n.id); curNote = null; renderNotes();
  const { error } = await sb.from("notes").delete().eq("id", n.id);
  if(error){ setStatus("削除に失敗しました", true); reload() }
}

/* ============ カレンダー ============ */
function renderCal(){
  const root = $("#v-cal"); root.replaceChildren();
  const y = cal.getFullYear(), m = cal.getMonth(), today = ymd(new Date());
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  const byDate = {}; for(const e of state.events) (byDate[e.date] ??= []).push(e);

  const grid = h("div",{class:"grid"});
  "日月火水木金土".split("").forEach(c => grid.append(h("div",{class:"dow"},c)));
  for(let i=0;i<first;i++) grid.append(h("div",{class:"day blank"}));
  for(let d=1; d<=days; d++){
    const date = ymd(new Date(y,m,d)), dow = new Date(y,m,d).getDay(), n = (byDate[date]||[]).length;
    grid.append(h("button",{type:"button",
      class:"day"+(dow===0?" sun":dow===6?" sat":"")+(date===today?" today":"")+(date===sel?" sel":""),
      "aria-label":`${m+1}月${d}日 予定${n}件`, onclick:()=>{sel=date;renderCal()}},
      h("span",{},String(d)),
      h("span",{class:"dots"}, ...Array.from({length:Math.min(n,3)}, () => h("i")))));
  }
  const move = n => { cal = new Date(y,m+n,1); renderCal() };
  const left = h("div",{},
    h("div",{class:"cal-head"},
      h("button",{class:"btn",type:"button","aria-label":"前の月",onclick:()=>move(-1)},"‹"),
      h("h2",{},`${y}年${m+1}月`),
      h("button",{class:"btn",type:"button",onclick:()=>{const t=new Date();cal=new Date(t.getFullYear(),t.getMonth(),1);sel=ymd(t);renderCal()}},"今日"),
      h("button",{class:"btn",type:"button","aria-label":"次の月",onclick:()=>move(1)},"›")),
    grid);

  const evs = state.events.filter(e => e.date===sel).sort((a,b) => (a.time||"99").localeCompare(b.time||"99"));
  const label = new Date(sel+"T00:00").toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
  const tIn = h("input",{type:"time","aria-label":"時刻(任意)"}), nIn = h("input",{placeholder:"予定を入力","aria-label":"予定"});
  const add = async () => {
    const t = nIn.value.trim(); if(!t){ nIn.focus(); return }
    const ev = { id:uid(), date:sel, time:tIn.value, title:t };
    state.events.push(ev); renderCal();
    const { error } = await sb.from("events").insert(ev);
    if(error){ setStatus("予定の保存に失敗しました", true); reload() }
  };
  nIn.addEventListener("keydown", e => { if(e.key==="Enter" && !e.isComposing) add() });
  const panel = h("div",{class:"panel"},
    h("h3",{},label),
    evs.length
      ? h("div",{}, ...evs.map(e => h("div",{class:"ev"},
          h("span",{class:"t"}, e.time || "終日"), h("span",{class:"n"}, e.title),
          h("button",{class:"btn danger",type:"button","aria-label":"予定を削除",onclick:async()=>{
            state.events = state.events.filter(x => x.id!==e.id); renderCal();
            const { error } = await sb.from("events").delete().eq("id", e.id);
            if(error){ setStatus("削除に失敗しました", true); reload() }
          }},"削除"))))
      : h("p",{class:"muted",style:"margin:0"},"この日の予定はありません。"),
    h("div",{class:"add"}, tIn, nIn, h("button",{class:"btn primary",type:"button",onclick:add},"予定を追加")));
  root.append(h("div",{class:"cal"}, left, panel));
}

/* ============ ファイル共有 ============ */
const ALLOWED = { pdf:"application/pdf", tex:"text/plain", mp3:"audio/mpeg", mp4:"video/mp4", jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png" };
const MAX_MB = 50;
const extOf = n => (n.split(".").pop() || "").toLowerCase();
const bucket = () => sb.storage.from("files");
const wide = () => matchMedia("(min-width:768px)").matches;

async function uploadFiles(list){
  let ok = 0;
  for(const f of list){
    const ext = extOf(f.name);
    if(!ALLOWED[ext]){ setStatus(`${f.name}: 対応していない形式です`, true); await sleep(1500); continue }
    if(f.size > MAX_MB*1048576){ setStatus(`${f.name}: ${MAX_MB}MBを超えています`, true); await sleep(1500); continue }
    setStatus(`アップロード中: ${f.name}`);
    const path = `${user.id}/${uid()}.${ext}`;
    const up = await bucket().upload(path, f, { contentType:ALLOWED[ext], upsert:false });
    if(up.error){ setStatus(`${f.name}: アップロードに失敗`, true); await sleep(1500); continue }
    const ins = await sb.from("files").insert({ path, name:f.name, size:f.size, mime:ALLOWED[ext] });
    if(ins.error){ await bucket().remove([path]); setStatus(`${f.name}: 登録に失敗`, true); await sleep(1500); continue }
    ok++;
  }
  if(ok) setStatus("アップロード完了");
  await reload();
}
async function signed(f, opts, sec = 3600){
  const { data, error } = await bucket().createSignedUrl(f.path, sec, opts);
  if(error) throw error;
  return data.signedUrl;
}
function renderFiles(){
  const root = $("#v-files"); root.replaceChildren();
  const input = h("input",{type:"file",multiple:true,hidden:true,accept:".pdf,.tex,.mp3,.mp4,.jpg,.jpeg,.png",
    onchange:e => { const fl = [...e.target.files]; e.target.value = ""; uploadFiles(fl) }});
  const list = h("div",{class:"pl"},
    h("div",{class:"bar"}, h("button",{class:"btn primary",type:"button",style:"flex:1",onclick:()=>input.click()},"ファイルを追加"), input),
    h("p",{class:"muted",style:"margin:0 16px 8px"},`PDF・TeX・MP3・MP4・JPG・PNG(1ファイル${MAX_MB}MBまで)`),
    h("div",{class:"items",id:"fitems"}));
  root.append(h("div",{class:"split"+(selFile?" open":"")}, list, h("div",{class:"pd",id:"fdetail"})));
  renderFileList(); renderFileDetail();
}
function renderFileList(){
  const box = $("#fitems"); if(!box) return; box.replaceChildren();
  if(!state.files.length){ box.append(h("div",{class:"empty"},"ファイルはまだありません。どの端末からでも追加でき、すべての端末で開けます。")); return }
  for(const f of state.files){
    box.append(h("button",{class:"item",type:"button","aria-current":String(f.id===selFile),onclick:()=>{selFile=f.id;renderFiles()}},
      h("b",{}, f.name),
      h("span",{}, `${extOf(f.name).toUpperCase()}  ${fmtSize(f.size)}  ${fmt(f.created_at)}`)));
  }
}
async function renderFileDetail(){
  const box = $("#fdetail"); if(!box) return; box.replaceChildren();
  const f = state.files.find(x => x.id===selFile);
  if(!f){ box.append(h("div",{class:"empty"},"ファイルを選ぶと、ここにプレビューが表示されます。")); return }
  const ext = extOf(f.name), pv = h("div",{class:"pv"}, h("p",{class:"muted"},"読み込み中…"));
  const tell = t => setStatus(t);
  box.append(
    h("div",{class:"row"},
      h("button",{class:"btn back",type:"button",onclick:()=>{selFile=null;renderFiles()}},"戻る"),
      h("strong",{style:"flex:1;word-break:break-all"}, f.name)),
    h("div",{class:"muted"}, `${fmtSize(f.size)}  ${fmt(f.created_at)}`),
    h("div",{class:"row"},
      h("button",{class:"btn",type:"button",onclick:async()=>{try{window.open(await signed(f),"_blank","noopener")}catch{tell("開けませんでした")}}},"開く"),
      h("button",{class:"btn",type:"button",onclick:async()=>{
        try{ const a = h("a",{href:await signed(f,{download:f.name})}); document.body.append(a); a.click(); a.remove() }
        catch{ tell("ダウンロードに失敗しました") }
      }},"ダウンロード"),
      h("button",{class:"btn",type:"button",onclick:async()=>{
        try{
          const url = await signed(f, undefined, 7*24*3600);
          try{ await navigator.clipboard.writeText(url); tell("共有リンク(7日間有効)をコピーしました") }
          catch{ prompt("共有リンク(7日間有効)。コピーして使ってください", url) }
        }catch{ tell("リンクを作れませんでした") }
      }},"共有リンク"),
      h("button",{class:"btn danger",type:"button",onclick:async()=>{
        if(!confirm("このファイルを削除しますか?")) return;
        const r1 = await bucket().remove([f.path]);
        if(r1.error){ tell("削除に失敗しました") ; return }
        await sb.from("files").delete().eq("id", f.id);
        selFile = null; await reload();
      }},"削除")),
    pv);
  try{
    const url = await signed(f);
    if(selFile !== f.id) return;
    pv.replaceChildren();
    if(ext==="jpg"||ext==="jpeg"||ext==="png") pv.append(h("img",{src:url,alt:f.name}));
    else if(ext==="mp3") pv.append(h("audio",{src:url,controls:true,preload:"metadata"}));
    else if(ext==="mp4") pv.append(h("video",{src:url,controls:true,playsinline:true,preload:"metadata"}));
    else if(ext==="pdf"){
      pv.append(wide() ? h("iframe",{src:url,title:f.name}) : h("p",{class:"muted"},"「開く」でPDFを表示できます。"));
    } else if(ext==="tex"){
      if(f.size > 300*1024) pv.append(h("p",{class:"muted"},"大きいため、プレビューは省略しました。「開く」で確認できます。"));
      else { const t = await (await fetch(url)).text(); if(selFile !== f.id) return; pv.append(h("pre",{},t)) }
    }
  }catch{ pv.replaceChildren(h("p",{class:"muted"},"プレビューを読み込めませんでした。")) }
}
// PCではドラッグ&ドロップでも追加できる
const filesSec = $("#v-files");
["dragover","dragenter"].forEach(ev => filesSec.addEventListener(ev, e => { e.preventDefault(); filesSec.classList.add("drop") }));
["dragleave","drop"].forEach(ev => filesSec.addEventListener(ev, e => { e.preventDefault(); filesSec.classList.remove("drop") }));
filesSec.addEventListener("drop", e => { if(user && e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files]) });
</script>
